<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000"/></marker>
    <marker id="ard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#a50021"/></marker>
    <style>
      .box{fill:#fff;stroke:#000;stroke-width:1.3}
      .enc{fill:#dce6f2;stroke:#000;stroke-width:1.3}
      .cls{fill:#e2efda;stroke:#000;stroke-width:1.3}
      .dec{fill:#fbe5d6;stroke:#000;stroke-width:1.3}
      .loss{fill:#fff;stroke:#a50021;stroke-width:1.5;stroke-dasharray:5 3}
      .ln{stroke:#000;stroke-width:1.3;fill:none}
      .lnd{stroke:#a50021;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
      .t{font-size:13px} .s{font-size:11.5px} .b{font-weight:bold}
    </style>
  </defs>
  <!-- input -->
  <rect x="15" y="160" width="95" height="110" class="box"/>
  <rect x="27" y="172" width="71" height="70" fill="#d9d9d9" stroke="#000"/>
  <ellipse cx="50" cy="207" rx="12" ry="25" fill="#f2f2f2" stroke="#000"/>
  <ellipse cx="76" cy="207" rx="12" ry="25" fill="#f2f2f2" stroke="#000"/>
  <text x="62" y="260" text-anchor="middle" class="s">Radiograph I</text>
  <line x1="110" y1="215" x2="140" y2="215" class="ln" marker-end="url(#ar)"/>
  <!-- encoder -->
  <rect x="142" y="165" width="120" height="100" class="enc" rx="6"/>
  <text x="202" y="200" text-anchor="middle" class="t b">ViT encoder</text>
  <text x="202" y="220" text-anchor="middle" class="s">DINOv2 ViT-B/14</text>
  <text x="202" y="240" text-anchor="middle" class="s">32&#215;32 patch tokens Z</text>
  <!-- branch lines -->
  <path d="M262 195 L300 195 L300 95 L330 95" class="ln" marker-end="url(#ar)"/>
  <path d="M262 235 L300 235 L300 335 L330 335" class="ln" marker-end="url(#ar)"/>
  <!-- evidence head -->
  <rect x="332" y="50" width="185" height="92" class="cls" rx="6"/>
  <text x="424" y="75" text-anchor="middle" class="t b">Evidence head</text>
  <text x="424" y="95" text-anchor="middle" class="s">class queries, readouts</text>
  <text x="424" y="113" text-anchor="middle" class="s">s<tspan baseline-shift="sub" font-size="9">c</tspan> = &#931;<tspan baseline-shift="sub" font-size="9">m</tspan> &#966;<tspan baseline-shift="sub" font-size="9">c,m</tspan> + b<tspan baseline-shift="sub" font-size="9">c</tspan> (exact)</text>
  <text x="424" y="131" text-anchor="middle" class="s">&#227;<tspan baseline-shift="sub" font-size="9">c</tspan> = normalise([&#966;<tspan baseline-shift="sub" font-size="9">c</tspan>]&#8330;)</text>
  <line x1="517" y1="75" x2="560" y2="75" class="ln" marker-end="url(#ar)"/>
  <rect x="562" y="55" width="140" height="40" class="box" rx="4"/>
  <text x="632" y="80" text-anchor="middle" class="s">Findings &#375;<tspan baseline-shift="sub" font-size="9">c</tspan> = &#963;(s<tspan baseline-shift="sub" font-size="9">c</tspan>)</text>
  <line x1="517" y1="120" x2="560" y2="120" class="ln" marker-end="url(#ar)"/>
  <rect x="562" y="102" width="140" height="40" class="box" rx="4"/>
  <text x="632" y="127" text-anchor="middle" class="s">Evidence maps &#227;<tspan baseline-shift="sub" font-size="9">c</tspan></text>
  <!-- decoder -->
  <rect x="332" y="290" width="185" height="92" class="dec" rx="6"/>
  <text x="424" y="314" text-anchor="middle" class="t b">Explanation decoder</text>
  <text x="424" y="333" text-anchor="middle" class="s">pool 16&#215;16 &#8594; projector &#8594; prefix</text>
  <text x="424" y="351" text-anchor="middle" class="s">Qwen2.5-1.5B + LoRA</text>
  <text x="424" y="369" text-anchor="middle" class="s">token grounding &#945;<tspan baseline-shift="sub" font-size="9">t,m</tspan></text>
  <line x1="517" y1="315" x2="560" y2="315" class="ln" marker-end="url(#ar)"/>
  <rect x="562" y="295" width="140" height="40" class="box" rx="4"/>
  <text x="632" y="313" text-anchor="middle" class="s">Explanation E</text>
  <text x="632" y="328" text-anchor="middle" class="s">"right pleural effusion"</text>
  <line x1="517" y1="360" x2="560" y2="360" class="ln" marker-end="url(#ar)"/>
  <rect x="562" y="342" width="140" height="40" class="box" rx="4"/>
  <text x="632" y="360" text-anchor="middle" class="s">Finding grounding b&#771;<tspan baseline-shift="sub" font-size="9">c</tspan></text>
  <text x="632" y="374" text-anchor="middle" class="s">sentence labeler &#969;<tspan baseline-shift="sub" font-size="9">c,t</tspan></text>
  <!-- losses -->
  <rect x="760" y="20" width="225" height="58" class="loss" rx="5"/>
  <text x="872" y="43" text-anchor="middle" class="s b">L<tspan baseline-shift="sub" font-size="9">anat</tspan> (gradient to classifier)</text>
  <text x="872" y="62" text-anchor="middle" class="s">evidence mass outside lung/heart &#937;<tspan baseline-shift="sub" font-size="9">c</tspan></text>
  <rect x="760" y="92" width="225" height="58" class="loss" rx="5"/>
  <text x="872" y="115" text-anchor="middle" class="s b">L<tspan baseline-shift="sub" font-size="9">suff</tspan>, L<tspan baseline-shift="sub" font-size="9">comp</tspan> (every 4th step)</text>
  <text x="872" y="134" text-anchor="middle" class="s">keep / blur top-15% evidence</text>
  <rect x="760" y="185" width="225" height="62" class="loss" rx="5"/>
  <text x="872" y="208" text-anchor="middle" class="s b">L<tspan baseline-shift="sub" font-size="9">align</tspan> = JS(sg[&#227;<tspan baseline-shift="sub" font-size="9">c</tspan>] &#8214; b&#771;<tspan baseline-shift="sub" font-size="9">c</tspan>)</text>
  <text x="872" y="228" text-anchor="middle" class="s">per finding asserted in the report</text>
  <rect x="760" y="262" width="225" height="58" class="loss" rx="5"/>
  <text x="872" y="285" text-anchor="middle" class="s b">L<tspan baseline-shift="sub" font-size="9">inst</tspan> (InfoNCE)</text>
  <text x="872" y="304" text-anchor="middle" class="s">negatives: other images with c</text>
  <rect x="760" y="345" width="225" height="58" class="box" rx="5"/>
  <text x="872" y="368" text-anchor="middle" class="s b">L<tspan baseline-shift="sub" font-size="9">cls</tspan> (masked BCE), L<tspan baseline-shift="sub" font-size="9">LM</tspan></text>
  <text x="872" y="387" text-anchor="middle" class="s">CheXbert labels; evidence sentences</text>
  <!-- loss connectors -->
  <path d="M702 115 L730 115 L730 49 L758 49" class="lnd" marker-end="url(#ard)"/>
  <path d="M702 125 L758 121" class="lnd" marker-end="url(#ard)"/>
  <path d="M702 135 L740 135 L740 205 L758 205" class="lnd" marker-end="url(#ard)"/>
  <path d="M702 355 L740 355 L740 225 L758 225" class="lnd" marker-end="url(#ard)"/>
  <path d="M740 290 L758 290" class="lnd" marker-end="url(#ard)"/>
  <text x="742" y="172" class="s" fill="#a50021">stop-gradient</text>
</svg>
